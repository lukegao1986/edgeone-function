<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>版式 D · 数据体</title>
<!--BASE_CSS-->
<!--BRIEF-->
<!--HELPER-->
<style>
  .kicker {
    align-self: flex-start;
    font-size: 28px; font-weight: 700; color: var(--accent);
    background: var(--accent-2); padding: 10px 22px; border-radius: 10px;
    margin-bottom: 52px;
  }
  .num-block { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 34px; }
  .num {
    font-family: var(--font-num);
    font-size: 300px; font-weight: 900; line-height: 0.9;
    letter-spacing: -0.05em; color: var(--accent);
    white-space: nowrap;
  }
  .unit { font-size: 62px; font-weight: 800; color: var(--ink); padding-bottom: 26px; }

  .takeaway {
    font-size: 54px; font-weight: 800; line-height: 1.5;
    max-width: 860px; margin-bottom: 44px;
  }
  .takeaway .em { color: var(--accent); }

  .bars { display: flex; flex-direction: column; gap: 22px; margin-bottom: 20px; }
  .bar-row { display: flex; align-items: center; gap: 24px; }
  .bar-row .name { flex: 0 0 260px; font-size: 34px; font-weight: 700; color: var(--ink-2); }
  .bar-row .track { flex: 1 1 auto; height: 34px; background: var(--accent-2); border-radius: 999px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .bar-row .val {
    flex: 0 0 130px; text-align: right;
    font-family: var(--font-num); font-size: 34px; font-weight: 900; color: var(--accent);
  }

  .source { margin-top: auto; font-size: 26px; color: var(--ink-3); font-weight: 600; }
</style>
</head>
<body data-cat="math2">
<div class="page">
  <div class="bar">
    <div class="bar-logo">
      <span class="mark">EJU Pro</span>
      <span class="sub">日本留学考试</span>
    </div>
    <span class="bar-cat" data-bind="bar-cat"></span>
  </div>

  <div class="body">
    <div class="watermark">DATA</div>
    <div class="kicker" data-bind="kicker"></div>

    <div class="num-block">
      <span class="num" data-bind="number"></span>
      <span class="unit" data-bind="unit"></span>
    </div>

    <div class="takeaway" data-bind="takeaway"></div>
    <div class="bars" data-bind="bars"></div>
    <div class="source" data-bind="source"></div>
  </div>

  <div class="hook">
    <span class="text" data-bind="hook"></span>
    <span class="brand">EJU Pro</span>
  </div>
</div>

<script>
(function () {
  var E = window.EJU;
  document.body.dataset.cat = E.pick('category', 'math2');

  var kicker = E.pick('kicker', E.pick('eyebrow', ''));
  var kEl = document.querySelector('[data-bind="kicker"]');
  if (!kicker) kEl.style.display = 'none'; else kEl.textContent = kicker;

  var numEl = document.querySelector('[data-bind="number"]');
  numEl.textContent = E.pick('number', '0');
  E.autofit(numEl, 300, 120, 720, 300);

  var unit = E.pick('unit', '');
  var uEl = document.querySelector('[data-bind="unit"]');
  if (!unit) uEl.style.display = 'none'; else uEl.textContent = unit;

  var tw = E.pick('takeaway', E.pick('subtitle', ''));
  var twEl = document.querySelector('[data-bind="takeaway"]');
  if (!tw) twEl.style.display = 'none';
  else twEl.innerHTML = String(tw).replace(/\*\*(.+?)\*\*/g, '<span class="em">$1</span>');
  E.autofit(twEl, 54, 36, 936, 260);

  var bars = E.pick('bars', []);
  var bbox = document.querySelector('[data-bind="bars"]');
  if (!Array.isArray(bars) || !bars.length) {
    bbox.style.display = 'none';
  } else {
    var max = Math.max.apply(null, bars.map(function (b) { return Number(b.value) || 0; })) || 1;
    bbox.innerHTML = bars.slice(0, 6).map(function (b) {
      var pct = Math.max(6, Math.round((Number(b.value) || 0) / max * 100));
      return '<div class="bar-row">' +
        '<div class="name">' + E.esc(b.name) + '</div>' +
        '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
        '<div class="val">' + E.esc(b.value) + '</div></div>';
    }).join('');
  }

  var src = E.pick('source', '');
  var sEl = document.querySelector('[data-bind="source"]');
  if (!src) sEl.style.display = 'none'; else sEl.textContent = '数据来源：' + src;

  E.mountBar(); E.mountHook(); E.finish();
})();
</script>
</body>
</html>
