<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>版式 E · 真题体</title>
<!--BASE_CSS-->
<!--BRIEF-->
<!--HELPER-->
<style>
  /* 真题体：白底 + 试卷感，与其余四套的色块语言刻意区分 */
  .page { background: #ffffff; }
  .bar { border-bottom-color: #d92d20; }

  .tag {
    align-self: flex-start;
    font-size: 28px; font-weight: 900; color: #fff;
    background: #d92d20; padding: 12px 26px; border-radius: 8px;
    margin-bottom: 36px;
  }
  .meta { font-size: 28px; color: var(--ink-3); font-weight: 700; margin-bottom: 26px; }

  .stem {
    background: #fffbeb;                 /* 荧光笔底 */
    border-left: 10px solid #f59e0b;
    padding: 40px 44px;
    font-size: 46px; font-weight: 700; line-height: 1.65;
    margin-bottom: 48px;
  }
  .stem .qimg { display: block; max-width: 100%; margin-top: 28px; }

  .note {                                 /* 红笔批注 */
    position: relative;
    border: 4px solid #d92d20;
    border-radius: 6px;
    padding: 34px 40px;
    background: #fff5f5;
    transform: rotate(-0.7deg);
    margin-bottom: 44px;
  }
  .note .nhead {
    position: absolute; top: -26px; left: 32px;
    background: #d92d20; color: #fff;
    font-size: 26px; font-weight: 900; padding: 6px 18px; border-radius: 4px;
  }
  .note ul { list-style: none; display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
  .note li { font-size: 40px; font-weight: 800; color: #b42318; line-height: 1.45; }

  .analysis h3 {
    font-size: 32px; font-weight: 900; color: var(--ink);
    border-bottom: 4px solid var(--ink); padding-bottom: 14px;
    display: inline-block; margin-bottom: 28px;
  }
  .analysis ol { list-style: none; counter-reset: a; display: flex; flex-direction: column; gap: 22px; }
  .analysis li {
    counter-increment: a; position: relative; padding-left: 62px;
    font-size: 42px; font-weight: 700; line-height: 1.5;
  }
  .analysis li::before {
    content: counter(a);
    position: absolute; left: 0; top: 4px;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--ink); color: #fff;
    font-family: var(--font-num); font-size: 26px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body data-cat="math2">
<div class="page">
  <div class="bar">
    <div class="bar-logo">
      <span class="mark">EJU Pro</span>
      <span class="sub">日本留学考试</span>
    </div>
    <span class="bar-cat" data-bind="bar-cat"></span>
  </div>

  <div class="body">
    <div class="tag" data-bind="tag"></div>
    <div class="meta" data-bind="meta"></div>

    <div class="stem">
      <div data-bind="stem"></div>
      <img class="qimg" data-bind="qimg" alt="" />
    </div>

    <div class="note">
      <span class="nhead">红笔批注</span>
      <ul data-bind="notes"></ul>
    </div>

    <div class="analysis">
      <h3>解题思路</h3>
      <ol data-bind="analysis"></ol>
    </div>
    <div class="gap"></div>
  </div>

  <div class="hook">
    <span class="text" data-bind="hook"></span>
    <span class="brand">EJU Pro</span>
  </div>
</div>

<script>
(function () {
  var E = window.EJU;
  document.body.dataset.cat = E.pick('category', 'math2');

  var q = E.pick('question', {}) || {};

  document.querySelector('[data-bind="tag"]').textContent = E.pick('tag', '过去問 · 真题精讲');
  var meta = E.pick('meta', q.meta || '');
  var mEl = document.querySelector('[data-bind="meta"]');
  if (!meta) mEl.style.display = 'none'; else mEl.textContent = meta;

  var stemEl = document.querySelector('[data-bind="stem"]');
  stemEl.textContent = q.stem || E.pick('title', '');
  E.autofit(stemEl, 46, 30);

  var img = document.querySelector('[data-bind="qimg"]');
  if (q.image) img.src = q.image; else img.style.display = 'none';

  var notes = Array.isArray(q.notes) ? q.notes : [];
  var nbox = document.querySelector('.note');
  if (!notes.length) { nbox.style.display = 'none'; }
  else {
    document.querySelector('[data-bind="notes"]').innerHTML =
      notes.slice(0, 4).map(function (t) { return '<li>' + E.esc(t) + '</li>'; }).join('');
  }

  var ana = Array.isArray(q.analysis) ? q.analysis : (Array.isArray(E.pick('points', [])) ? E.pick('points', []) : []);
  var abox = document.querySelector('.analysis');
  if (!ana.length) { abox.style.display = 'none'; }
  else {
    document.querySelector('[data-bind="analysis"]').innerHTML =
      ana.slice(0, 4).map(function (t) { return '<li>' + E.esc(t) + '</li>'; }).join('');
  }

  E.mountBar(); E.mountHook(); E.finish();
})();
</script>
</body>
</html>
